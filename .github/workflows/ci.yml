name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['14', '18', '20']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: npm install

      - name: Test (reporter + conformance gate)
        run: npm test

      - name: Validate golden fixture (sanity)
        run: python conformance/validate_report.py conformance/golden_report.xml
